<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="gh-markdown.css">
<style>
  body { width: 780px; background: #ffffff; }
  .pattern {
    margin: 6px 42px 10px;
    border-left: 6px solid #e07850;
    background: #faf9f7;
    padding: 26px 32px 26px 30px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    color: #1f2328;
    font-size: 21px;
    line-height: 1.6;
  }
  .pattern .goal {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .pattern p { margin: 0 0 14px; }
  .pattern p:last-child { margin-bottom: 0; }
  .pattern .k { font-weight: 700; color: #b85c38; }
</style>
</head>
<body data-vw="780">
<div class="pattern">
  <div class="goal">Preserve the user's mental model during asynchronous work.</div>
  <p><span class="k">Why:</span> loading should reduce uncertainty without destroying useful context or allowing duplicate actions.</p>
  <p><span class="k">Good:</span> the save button stays in place, shows pending state, prevents duplicate submission, then success or a recoverable error.</p>
</div>
</body></html>
