<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="gh-markdown.css">
<style>
  body { width: 780px; }
  .markdown-body { font-size: 22px; line-height: 1.65; padding: 26px 42px 30px; }
  .markdown-body ul { margin: 0; }
</style>
</head>
<body data-vw="780">
<div class="markdown-body">
<ul>
<li><strong>ALWAYS</strong> add a skeleton while data loads</li>
<li><strong>NEVER</strong> show a blank page</li>
<li><strong>ALWAYS</strong> put <code>Suspense</code> around the page</li>
<li><strong>NEVER</strong> move buttons while saving</li>
<li><strong>ALWAYS</strong> disable the button during a request</li>
<li><strong>ALWAYS</strong> show a spinner inside the button</li>
</ul>
</div>
</body></html>
